name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.14.2 / Home Assistant 2026.10.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-ci.txt
      - name: Verify target runtime and dependencies
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.metadata
          import sys
          import homeassistant.core

          assert sys.version_info[:3] == (3, 14, 2), sys.version
          assert importlib.metadata.version("homeassistant") == "2026.10.0"
          PY
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests scripts
      - name: Unit and real Home Assistant tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build release archives
        run: python scripts/build_release.py
      - name: Verify cold install from packaged archive
        run: python -I scripts/check_install.py dist/ghmq-0.1.1-install.zip

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The official action wrapper pulls its upstream GHCR validator image.
      - name: Validate integration
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # HACS reads GitHub repository metadata itself; no checkout is needed.
      # The official action wrapper pulls its upstream GHCR validator image.
      - name: Validate repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
